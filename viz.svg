<text x="56.0" y="448.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Total 20. Array-based Prim is O(n²) — optimal for complete graphs, where Kruskal</text>
<text x="56.0" y="467.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">would first have to build and sort all n²/2 edges.</text>
