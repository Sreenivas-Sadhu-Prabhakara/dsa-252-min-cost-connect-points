<text x="56.0" y="197.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Prim's fits implicit graphs: keep, per unvisited point, its cheapest distance to the</text>
<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">growing tree; each round absorb the closest point and relax the rest in O(n). Here:</text>
<text x="56.0" y="235.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">(0,0)→(2,2) 4, (2,2)→(5,2) 3, (5,2)→(7,0) 4, (2,2)→(3,10) 9.</text>
<text x="24.0" y="259.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="600">prim rounds</text>
